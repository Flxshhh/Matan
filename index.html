<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конспекты</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4c6ef5">
  <meta name="apple-mobile-web-app-title" content="Конспекты">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // тема применяется до отрисовки, чтобы не мигало
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Оглавление">☰</button>
    <a href="#/" class="brand"><img class="brand-mark" src="assets/icons/icon.svg" alt=""><span>Конспекты</span></a>
    <div class="search" id="search">
      <input id="searchInput" type="search" placeholder="Поиск по конспектам…" autocomplete="off" aria-label="Поиск">
      <kbd class="search-kbd">/</kbd>
      <div class="search-pop" id="searchPop" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему" title="Сменить тему"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Оглавление"></nav>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main"><p class="muted">Загрузка…</p></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
